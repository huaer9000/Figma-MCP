<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, "PingFang SC", sans-serif;
        font-size: 12px;
        color: #1e1e1e;
      }
      body {
        margin: 12px;
      }
      h1 {
        font-size: 13px;
        margin: 0 0 10px;
      }
      dl {
        margin: 0 0 12px;
      }
      dt {
        color: #6b6b6b;
        margin-top: 6px;
      }
      dd {
        margin: 2px 0 0;
        word-break: break-all;
      }
      #status[data-state="ok"] {
        color: #0d7a3f;
        font-weight: 600;
      }
      #status[data-state="off"] {
        color: #b42318;
        font-weight: 600;
      }
      #error {
        min-height: 2.4em;
        color: #b42318;
        margin: 0 0 10px;
      }
      button {
        width: 100%;
        height: 28px;
      }
    </style>
  </head>
  <body>
    <h1>Figma设计桥接</h1>
    <dl>
      <dt>状态</dt>
      <dd id="status" data-state="off">未连接</dd>
      <dt>文件</dt>
      <dd id="file">—</dd>
      <dt>页面</dt>
      <dd id="page">—</dd>
      <dt>端口</dt>
      <dd id="port">17653</dd>
    </dl>
    <p id="error">未连接。请先启动任意 Agent 的 Figma设计桥接 MCP。</p>
    <button id="reconnect" type="button">重连</button>
    <script>
      /*INLINE_UI*/
    </script>
  </body>
</html>
